name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only one deploy at a time. Nothing here pushes commits automatically the
# way the dashboard's upload worker does, so this is just insurance against a
# manual dispatch racing a push and the two fighting over the gh-pages ref.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Record this deploy's commit as the build ID
        run: echo "$GITHUB_SHA" > public/build-id.txt

      # Without VITE_API_BASE this build talks to the old upload Worker, whose
      # allowlist has no planning:field-jobs — so the read rejected, the job
      # list never arrived, and this copy sat on skeleton rows for ever. It
      # points at the field Worker's API instead, cross-origin.
      #
      # APP_BASE stays at its /cde-field/ default: this copy is served from a
      # repo subpath, unlike the Worker one.
      - run: npm run build
        env:
          VITE_API_BASE: https://cd-field.fkw24.workers.dev/api
          VITE_DASHBOARD_URL: https://cd-dashboard.fkw24.workers.dev/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # A phone holds a stale app shell far longer than a desktop tab, so
          # this matters more here than on the dashboard: without it a deploy
          # deletes the content-hashed files a cached index.html still asks
          # for, and the app is a blank screen before React mounts.
          keep_files: true
